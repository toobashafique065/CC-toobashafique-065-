---
- name: Install Apache (httpd)
  yum:
    name: httpd
    state: present

- name: Enable and start Apache
  service:
    name: httpd
    state: started
    enabled: true

- name: Deploy backend index page
  template:
    src: backend_index.html.j2
    dest: /var/www/html/index.html
  notify: Restart httpd
